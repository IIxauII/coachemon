name: CI

# The root package's gate. Until #259 this ran only on a push to master, inside `release.yml` — so a pull request was
# checked by `extension.yml` alone, which typechecks, builds and tests the *extension* package. `npm test` and
# `npm run typecheck` at the root never saw a PR.
on: [push, pull_request]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  core:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      # `--ignore-scripts` is the root install everywhere else in CI: the release toolchain stays out of a player's
      # plugin cache (§5.1).
      - run: npm ci --ignore-scripts

      - run: npm run typecheck

      # `npm test` is both suites: `node --test "src/**/*.test.ts"` and then the 24 HUD goldens
      # (`skills/coachemon/scripts/test/run.mjs`, ~16s). They are one command on purpose — the goldens are the only
      # check that calls `bundle()`, and when they were a separate command nothing in CI ran them, so master stayed
      # 406/406 green for an hour with the HUD bundle unable to link (#259).
      - run: npm test

      # `drift:check` is deliberately not here: it is a pin-bump check, not a per-push one. At a fixed pinned ref the
      # hashes cannot move, and it clones pagefaultgames/pokerogue to compare.
