name: CI

# The root package's gate. Until #259 this ran only on a push to master, inside `release.yml` — so a pull request was
# checked by `extension.yml` alone, which typechecks, builds and tests the *extension* package. `npm test` and
# `npm run typecheck` at the root never saw a PR.
#
# If a commit gets no run here at all, check its message before anything else: GitHub matches `[skip ci]` anywhere in a
# commit message, a sentence merely talking about it included. The rule for writing messages lives in `CLAUDE.md`,
# which an agent loads before it writes one — not here, where nobody reads it in time (#275, #278).
on: [push, pull_request]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  core:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      # `--ignore-scripts` is the root install at all three CI call sites: Claude Code installs the plugin the same way,
      # and the plugin is not a workspace, so WXT never lands in a player's cache (§5.1). (The release toolchain stays
      # out for a different reason — semantic-release is not a devDependency, `release.yml`.)
      - run: npm ci --ignore-scripts

      - run: npm run typecheck

      # `npm test` is both suites: `node --test "src/**/*.test.ts"` and then the 24 HUD goldens
      # (`skills/coachemon/scripts/test/run.mjs`, ~16s). They are one command on purpose — as separate commands,
      # nothing in CI ran the goldens at all. A *link* break was already caught on a PR, because `extension.yml`'s
      # `build:all` calls `bundle("hud")` (`extension/wxt.config.ts`); what went ungated everywhere was a golden
      # diff — a behaviour change with a bundle that links fine — and the root suites on a PR (#259).
      - run: npm test

      # `gen-enums.ts` reads the pinned game tag, so its output is a function of the pin, the generator and
      # `src/enums/parse.ts` alone: a hand-edit to `src/enums/generated.ts`, or a generator change nobody re-ran,
      # is red here instead of being silently undone by the next generate (#258). The tag is immutable, so the
      # ~46 raw fetches cache on the pin.
      - name: Cache the pinned game source
        uses: actions/cache@v4
        with:
          path: .cache/pokerogue-src
          key: pokerogue-src-${{ hashFiles('src/escape-ladder/reviewed.json') }}
      - run: npm run enums:gen -- --check

      # `drift:check` is deliberately not here: it is a pin-bump check, not a per-push one. At a fixed pinned ref the
      # hashes cannot move, and it clones pagefaultgames/pokerogue to compare.
