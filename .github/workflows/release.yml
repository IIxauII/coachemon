name: Release

on:
  push:
    branches: [master]

concurrency:
  group: release
  cancel-in-progress: false

permissions:
  contents: write
  issues: write
  pull-requests: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - run: npm ci --ignore-scripts

      # The snapshot refresh runs *here*, not in semantic-release's `prepareCmd`, so the suite below sees the exact
      # `05-randbats.js` the release commits (#258). `prepareCmd` still writes the three version files after the
      # suite, which is what a release must do; no *code* is written after it. `chore(release)` is `[skip ci]`, so
      # no workflow ever runs on that commit:
      # before this, the bot regenerated `05-randbats.js` after the tests and pushed it unseen, and a generator that
      # had drifted from the file it writes (the pre-#191 non-module form) took master red for a whole release.
      # A failed refresh is not a failed release — `gen-randbats.ts` keeps the existing snapshot and exits 0.
      # The marker is matched against the *commit message*, not the workflow; `CLAUDE.md` carries the rule for
      # writing one (#275, #278).
      - run: npm run randbats:gen

      - run: npm run typecheck

      # `npm test` is both suites since #259: the unit tests and then the 24 HUD goldens, which bundle the real
      # `skills/coachemon/scripts/hud/*.js` and so catch a generated module that stopped exporting a name another
      # one imports. The golden run used to be spelled out here as well; that second run is gone (#278).
      - run: npm test

      # The `chore(release)` commit is the one thing that pushes straight to master, and master is gated on `core` and
      # `extension` having run before any ref update lands (#275). A required check that never ran counts as pending
      # rather than passed, which is the point — a commit whose message suppressed every workflow can no longer look
      # like a green one — but it means this push needs a bypass of its own. A user-owned repo may only name a deploy
      # key or a repository role as a bypass actor: the GitHub Actions app is org-only, so `GITHUB_TOKEN` cannot be
      # excused, and every role wide enough to cover it also covers the owner, handing back the silent force-merge the
      # rule exists to remove. So the ruleset excuses one write deploy key, and this job pushes as that key.
      #
      # A file rather than an agent, because `SSH_AUTH_SOCK` is environment and no environment survives between steps —
      # each `run:` is a fresh shell, so an agent started here would be gone by the time the release pushes. A config
      # file is re-read by every `ssh` the job starts, the one inside the `npx` child included, because `$HOME` is the
      # same. `IdentitiesOnly` stops ssh offering a runner-provided identity ahead of the key. The modes are set rather
      # than left to the runner's umask: ssh ignores a group-writable config *and carries on without it*. Written whole
      # with `>`, not appended — ssh honours the first matching directive, so a pre-existing entry would win.
      - name: Load the release deploy key
        env:
          DEPLOY_KEY: ${{ secrets.RELEASE_DEPLOY_KEY }}
        run: |
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh
          (umask 077; printf '%s\n' "$DEPLOY_KEY" > ~/.ssh/release_ed25519)
          ssh-keyscan -t ed25519 github.com >> ~/.ssh/known_hosts
          printf 'Host github.com\n  IdentityFile ~/.ssh/release_ed25519\n  IdentitiesOnly yes\n' > ~/.ssh/config
          chmod 600 ~/.ssh/config

      # Every failure of the ssh path below is silent, so it is proved here instead. semantic-release resolves the push
      # url *once*, up front: it tries a dry-run push over the url it is handed and, when that throws, rewrites it into
      # an https url carrying `GITHUB_TOKEN` — without verifying that one, and reporting it only through `debug`. So a
      # malformed secret, an ignored config or a key that lost its write grant does not fail the release; it quietly
      # pushes over https instead, which is the one thing the ruleset rejects. Before the ruleset was on that went
      # green while proving nothing; with it on, the release dies mid-run, after the tests and after the version stamp
      # is already committed locally, with no tag and no GitHub release.
      #
      # This is the same command semantic-release runs, so it fails here or not at all, and `bash -e` stops the job on
      # it. `--dry-run` is not evaluated against the ruleset: it proves the transport and the write grant, nothing else.
      - name: Prove the deploy key can push
        run: git push --dry-run --no-verify -- git@github.com:${{ github.repository }}.git HEAD:master

      # semantic-release is not a devDependency on purpose: installing the plugin
      # runs `npm ci` in Claude Code's cache, and it should not pull the release toolchain.
      #
      # `--repository-url` is what routes the push over that key. semantic-release tries the url it is handed as-is
      # first, with a dry-run push, and only rewrites it into an https url carrying `GITHUB_TOKEN` when that attempt
      # fails — so an ssh url that works is never swapped out. Unset, it would read `origin` from the checkout, which
      # is https; `package.json` carries no `repository` field that would override that. The token stays regardless:
      # `@semantic-release/github` needs it for the release, the notes and the PR comments, none of which are a push.
      - name: Release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: >
          npx --yes
          -p semantic-release@25
          -p @semantic-release/exec@7
          -p @semantic-release/git@11
          semantic-release
          --repository-url git@github.com:${{ github.repository }}.git

  # The extension's own semantic-release run, on `extension-v*` tags (§14.2, §14.3). It comes second and checks out
  # `master` fresh, so it builds on top of the job above's `chore(release)` commit when there was one and ships that
  # commit's `05-randbats.js`. Both jobs sit in the one `release` concurrency group, so two pushes never interleave.
  #
  # Only the server stream comments on the PRs a release contains; this one would say the same thing twice, so its
  # `@semantic-release/github` has the comments and the failure issue turned off. A failed extension release is a
  # failed job here.
  release-extension:
    needs: release
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: master
          fetch-depth: 0
          persist-credentials: false

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: |
            package-lock.json
            extension/package-lock.json

      # The root install is what `src/page/` and `src/protocol/` build against; `extension/` has its own lockfile so
      # WXT never lands in a player's plugin cache (§5.1).
      - run: npm ci --ignore-scripts
      - run: npm ci
        working-directory: extension

      # `stamp-extension.ts` builds and zips in `prepare`; `submit-extension.ts` submits in `publish`, and does nothing
      # at all while the version is 0.x (§14.1). Neither runs unless the commit filter found a release to make.
      - name: Release extension
        working-directory: extension
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Chrome Web Store API v2 authenticates as a GCP service account; the v1.1 client id, secret and refresh
          # token are not used, because v1.1 loses support on 2026-10-15 and cannot cancel a pending review (§14.4).
          CHROME_EXTENSION_ID: ${{ secrets.CWS_EXTENSION_ID }}
          CHROME_PUBLISHER_ID: ${{ secrets.CWS_PUBLISHER_ID }}
          CHROME_SERVICE_ACCOUNT_CLIENT_EMAIL: ${{ secrets.CWS_SERVICE_ACCOUNT_EMAIL }}
          CHROME_SERVICE_ACCOUNT_PRIVATE_KEY: ${{ secrets.CWS_SERVICE_ACCOUNT_PRIVATE_KEY }}
          # AMO's extension id is the gecko id, which `submit-extension.ts` reads off the built manifest (§5.3).
          FIREFOX_JWT_ISSUER: ${{ secrets.AMO_JWT_ISSUER }}
          FIREFOX_JWT_SECRET: ${{ secrets.AMO_JWT_SECRET }}
        run: >
          npx --yes
          -p semantic-release@25
          -p @semantic-release/exec@7
          semantic-release
