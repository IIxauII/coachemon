name: Release

on:
  push:
    branches: [master]

concurrency:
  group: release
  cancel-in-progress: false

permissions:
  contents: write
  issues: write
  pull-requests: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - run: npm ci --ignore-scripts
      - run: npm run typecheck
      - run: npm test

      # semantic-release is not a devDependency on purpose: installing the plugin
      # runs `npm ci` in Claude Code's cache, and it should not pull the release toolchain.
      - name: Release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: >
          npx --yes
          -p semantic-release@25
          -p @semantic-release/exec@7
          -p @semantic-release/git@11
          semantic-release
